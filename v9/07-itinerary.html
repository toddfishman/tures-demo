var TRIPS = [

       {title:'Hotel Sanders, Copenhagen', meta:'Dec 10 → 13 · Junior Suite', status:['pill-confirm','Verified'], detail:'Booked direct · <span class="font-mono" style="color:var(--confirm-ink)">rate-protected −$351</span> · <span class="font-mono">CONF SAN-3398</span>'}
     ],
     dining:[
       {title:'Septime, Paris', meta:'Dec 5 · 20:00 · 2 guests', status:['pill-confirm','Confirmed'], detail:'Tasting menu · held on deposit · window table requested.'},
       {title:'Frenchie, Paris', meta:'Dec 6 · 21:00 · 2 guests', status:['pill-confirm','Confirmed'], detail:'Counter seats · wine pairing.'},
       {title:'Aurora dinner, Javri Lodge', meta:'Dec 8 · in-lodge', status:['pill-confirm','Included'], detail:'Half-board — reindeer &amp; cloudberry tasting.'},
       {title:'Kadeau, Copenhagen', meta:'Dec 11 · 19:30 · 2 guests', status:['pill-pending','Requested'], detail:'On the list — Tures is holding for confirmation.'}
     ],

       {title:'Ivalo airport → Javri Lodge', meta:'Dec 7 · lodge transfer', status:['pill-confirm','Included'], detail:'Heated transfer · 35 min.'},

     ],

       {title:'Aurora snowmobile safari', meta:'Dec 8 · 21:00', status:['pill-confirm','Booked'], detail:'Guided · thermal suits · hot berry juice.'},

     ]

   cats:{
     flights:[ {title:'NH 175 · SFO → HND', meta:'Apr 2 · Business · The Room', status:['pill-confirm','Flown'], detail:'<span class="font-mono">PNR NH8821</span>'}, {title:'NH 110 · HND → SFO', meta:'Apr 9 · Business', status:['pill-confirm','Flown'], detail:'<span class="font-mono">PNR NH9120</span>'} ],
     lodging:[ {title:'Aman Tokyo', meta:'Apr 2 → 6 · Deluxe', status:['pill-confirm','Stayed'], detail:'Otemachi · onsen · <span class="font-mono">CONF AMN-7741</span>'}, {title:'Gora Kadan, Hakone', meta:'Apr 6 → 9 · ryokan', status:['pill-confirm','Stayed'], detail:'Private onsen suite · kaiseki.'} ],
     dining:[ {title:'Sukiyabashi Jiro', meta:'Apr 3 · 17:30', status:['pill-confirm','Dined'], detail:'Counter · omakase.'}, {title:'Den, Tokyo', meta:'Apr 4 · 19:00', status:['pill-confirm','Dined'], detail:'The famous "Dentucky".'} ],
     transportation:[ {title:'HND → Aman · private car', meta:'Apr 2', status:['pill-confirm','Done'], detail:'Toyota Century.'}, {title:'Romancecar → Hakone', meta:'Apr 6 · reserved', status:['pill-confirm','Done'], detail:'Front car, Mt Fuji side.'} ],

   }
 },
 { id:'bigisland', title:'The Big Island', places:'Kona · Hilo', dates:'Oct 12 – 19, 2026', status:['pill-pending','Planning'], blurb:'Held and ready — your word turns it real.',
   cats:{
     flights:[ {title:'AS 824 · SEA → KOA', meta:'Oct 12 · First', status:['pill-pending','Held'], detail:'Two seats held for 48h.'} ],
     lodging:[ {title:'Four Seasons Hualālai', meta:'Oct 12 → 19 · Ocean view', status:['pill-pending','Held'], detail:'Hold expires Friday.'} ],
     dining:[ {title:'ULU Ocean Grill', meta:'Oct 13 · 19:00', status:['pill-pending','Suggested'], detail:'Tures’ pick for night one.'} ],
     transportation:[ {title:'Kona airport · SUV', meta:'Oct 12', status:['pill-pending','Suggested'], detail:'4x4 for the volcano road.'} ],
     excursions:[ {title:'Mauna Kea summit &amp; stars', meta:'Oct 15 · evening', status:['pill-pending','Suggested'], detail:'Private guide · telescopes.'}, {title:'Manta night snorkel', meta:'Oct 16', status:['pill-pending','Suggested'], detail:'Small group.'} ]
   }
 }
];
var CATS = [
  {k:'flights', label:'Flights', mk:'F'},
  {k:'lodging', label:'Lodging', mk:'L'},
  {k:'dining', label:'Dining', mk:'D'},
  {k:'transportation', label:'Transportation', mk:'T'},
  {k:'excursions', label:'Excursions', mk:'E'}
];

var viewEl = document.getElementById('view');
var crumbsEl = document.getElementById('crumbs');
var heroTitle = document.getElementById('heroTitle');
var heroSub = document.getElementById('heroSub');

function tripById(id){ for(var i=0;i<TRIPS.length;i++) if(TRIPS[i].id===id) return TRIPS[i]; return null; }
function catByKey(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].k===k) return CATS[i]; return null; }
function pill(s){ return s ? '<span class="pill '+s[0]+' shrink-0">'+s[1]+'</span>' : ''; }
function mark(mk){ return '<span class="shrink-0 grid place-items-center font-mono text-sm" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--canvas-line);color:var(--gold-deep);background:rgba(200,162,74,0.08)">'+mk+'</span>'; }
function setHero(t,s){ heroTitle.textContent=t; heroSub.textContent=s; }
function crumbs(parts){
  crumbsEl.innerHTML = parts.map(function(p,i){
    if(i===parts.length-1) return '<span class="text-ink">'+p.label+'</span>';
    return '<a href="'+p.hash+'" class="quiet hover:text-gold-deep" style="color:inherit">'+p.label+'</a><span class="text-ink-faint">/</span>';
  }).join(' ');
}
function fade(){ [].forEach.call(viewEl.querySelectorAll('.legcard'), function(c){ requestAnimationFrame(function(){ c.classList.add('in'); }); }); }

function renderTrips(){
  setHero('Every trip, kept.', 'Booked, verified twice, and filed. Open a trip to see its receipts.');
  crumbs([{label:'Trips'}]);
  var html = '<div class="caps text-[11px] text-ink-faint mb-4">'+TRIPS.length+' trips · tap to open</div><div class="space-y-3">';
  TRIPS.forEach(function(t,i){
    var counts = CATS.map(function(c){ var n=(t.cats[c.k]||[]).length; return n? n+' '+c.label.toLowerCase() : null; }).filter(Boolean).join(' · ');
    html += '<a href="#'+t.id+'" class="legcard leaf lift block p-5 quiet" style="transition-delay:'+(i*55)+'ms">'+
      '<div class="flex items-start gap-4">'+
        '<div class="flex-1 min-w-0">'+
          '<div class="flex items-center gap-2 flex-wrap"><span class="font-display text-2xl text-ink leading-tight">'+t.title+'</span>'+pill(t.status)+'</div>'+
          '<div class="text-sm text-ink-soft mt-1">'+t.places+' · '+t.dates+'</div>'+
          '<div class="text-[12px] text-ink-faint mt-2">'+counts+'</div>'+
        '</div>'+
        '<span class="exp-chev text-gold-deep text-xl shrink-0">›</span>'+
      '</div></a>';
  });
  viewEl.innerHTML = html + '</div>'; fade();
}

function renderTrip(t){
  setHero(t.title, t.places+' · '+t.dates);
  crumbs([{label:'Trips', hash:'#'}, {label:t.title}]);
  var html = '<div class="caps text-[11px] text-ink-faint mb-4">'+t.blurb+'</div><div class="grid sm:grid-cols-2 gap-3">';
  CATS.forEach(function(c,i){
    var n=(t.cats[c.k]||[]).length;
    html += '<a href="#'+t.id+'/'+c.k+'" class="legcard leaf lift flex items-center gap-3 p-4 quiet" style="transition-delay:'+(i*45)+'ms">'+
      mark(c.mk)+
      '<div class="flex-1 min-w-0"><div class="font-display text-xl text-ink leading-tight">'+c.label+'</div>'+
      '<div class="text-[12px] text-ink-faint mt-0.5">'+(n? n+(n===1?' item':' items') : 'Nothing yet')+'</div></div>'+
      '<span class="exp-chev text-gold-deep text-xl shrink-0">›</span></a>';
  });
  viewEl.innerHTML = html + '</div>'; fade();
}

function renderCategory(t,c){
  var items = t.cats[c.k]||[];
  setHero(t.title, c.label+' · '+t.dates);
  crumbs([{label:'Trips', hash:'#'}, {label:t.title, hash:'#'+t.id}, {label:c.label}]);
  var html = '<div class="caps text-[11px] text-ink-faint mb-4">'+c.label+' · '+items.length+(items.length===1?' item':' items')+'</div><div class="space-y-2.5">';
  if(!items.length) html += '<div class="leaf p-5 text-sm text-ink-soft">Nothing here yet.</div>';
  items.forEach(function(it,i){
    html += '<div class="exp legcard leaf" style="transition-delay:'+(i*50)+'ms">'+
      '<div class="exp-head flex items-center gap-3 p-4 cursor-pointer">'+
        '<div class="flex-1 min-w-0"><div class="font-mono text-[14px] text-ink leading-tight">'+it.title+'</div>'+
        '<div class="text-[12px] text-ink-faint mt-0.5">'+it.meta+'</div></div>'+
        pill(it.status)+'<span class="exp-chev text-gold-deep">›</span>'+
      '</div>'+
      '<div class="exp-body"><div class="px-4 pb-4"><div class="rule-ink mb-3"></div>'+
        '<p class="text-[13px] text-ink-soft leading-relaxed">'+it.detail+'</p></div></div>'+
    '</div>';
  });
  viewEl.innerHTML = html + '</div>'; fade();
}

function route(){
  var h = (location.hash||'').replace(/^#/, '');
  if(!h){ renderTrips(); window.scrollTo(0,0); return; }
  var parts = h.split('/');
  var t = tripById(parts[0]);
  if(!t){ renderTrips(); window.scrollTo(0,0); return; }
  var c = parts[1] ? catByKey(parts[1]) : null;
  if(c){ renderCategory(t,c); } else { renderTrip(t); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
