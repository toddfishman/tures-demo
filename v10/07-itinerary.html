<style>
  body{ background:var(--gh-bg); font-family:'DM Sans',sans-serif; padding-bottom:84px; }

  /* ───── the passport: a trip as a boarding pass ───── */
  .trip-card{ position:relative; display:block; cursor:pointer; border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.1); background:var(--gh-card); box-shadow:0 24px 54px -32px rgba(0,0,0,0.92);
    opacity:0; transform:translateY(12px); transition:transform .2s ease, border-color .25s ease, opacity .5s ease, box-shadow .25s ease; }
  .trip-card.in{ opacity:1; transform:none; }
  .trip-card:hover{ transform:translateY(-4px); border-color:var(--gold); box-shadow:0 30px 60px -30px rgba(0,0,0,0.95), 0 0 24px -10px var(--gold); }
  .tc-art{ position:relative; height:172px; }
  .tc-art .img{ position:absolute; inset:0; background-size:cover; background-position:center; transition:transform .7s cubic-bezier(.2,.6,.2,1); }
  .trip-card:hover .tc-art .img{ transform:scale(1.05); }
  .tc-art .veil{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,13,8,0.05) 35%, rgba(10,13,8,0.6) 75%, var(--gh-card) 100%); }
  .tc-stamp{ position:absolute; top:13px; right:13px; z-index:2; }
  .tc-route{ position:absolute; left:14px; bottom:12px; z-index:2; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:.06em; color:var(--gh-cream); display:flex; align-items:center; gap:7px; }
  .tc-stub{ position:relative; padding:18px 18px 20px; border-top:1px dashed rgba(255,255,255,0.18); }
  .tc-stub::before, .tc-stub::after{ content:""; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--gh-bg); }
  .tc-stub::before{ left:-9px; } .tc-stub::after{ right:-9px; }
  .tc-dest{ font-family:'Playfair Display',serif; font-size:22px; color:var(--gh-cream); line-height:1.1; }
  .tc-meta{ font-size:12.5px; color:var(--gh-cream-dim); margin-top:4px; }
  .tc-open{ margin-top:13px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); display:inline-flex; gap:7px; }

  /* ───── detail dossier ───── */
  .dt-hero{ position:relative; height:clamp(180px,28vw,300px); border-radius:18px; overflow:hidden; border:1px solid var(--gold); margin-bottom:8px; }
  .dt-hero .img{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .dt-hero .veil{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,13,8,0.2) 0%, rgba(10,13,8,0.55) 60%, rgba(10,13,8,0.9) 100%); }
  .dt-hero .cap{ position:absolute; left:0; right:0; bottom:0; padding:24px 26px; z-index:2; }

  .sec-tab{ cursor:pointer; padding:8px 15px; border-radius:99px; font-size:12.5px; white-space:nowrap; text-decoration:none;
    border:1px solid rgba(255,255,255,0.14); color:var(--gh-cream-dim); background:rgba(255,255,255,0.04); transition:all .14s; }
  .sec-tab:hover{ border-color:var(--gold); color:var(--gh-cream); }
  .sec-tab.on{ background:var(--gold); color:#06120a; border-color:var(--gold); font-weight:600; }

  .mt-item{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:12px; padding:16px; }
  .mt-name{ font-family:'Playfair Display',serif; font-size:18px; color:var(--gh-cream); line-height:1.15; }
  .mt-meta{ font-size:12.5px; color:var(--gh-cream-dim); margin-top:3px; }
  .mt-note{ font-size:13px; color:var(--gh-cream-dim); margin-top:8px; line-height:1.6; }
  .mt-conf{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); flex-shrink:0; }
  .item-thumb{ width:60px; height:60px; border-radius:11px; flex-shrink:0; background-size:cover; background-position:center;
    border:1px solid rgba(255,255,255,0.12); display:grid; place-items:center; font-family:'Playfair Display',serif; color:var(--gold); font-size:22px; background-color:rgba(255,255,255,0.05); }
  .alts{ overflow:hidden; max-height:0; opacity:0; transition:max-height .3s ease, opacity .25s ease, margin .3s ease; }
  .alts.open{ max-height:240px; opacity:1; margin-top:10px; }
  .alt-row{ font-size:13px; color:var(--gh-cream-dim); padding:6px 0; display:flex; align-items:center; gap:8px; }
  .alt-swap{ margin-left:auto; font-size:11px; color:var(--gold); cursor:pointer; }
  .alt-swap:hover{ text-decoration:underline; }
  .sec-block{ opacity:0; transform:translateY(8px); transition:opacity .45s ease, transform .45s ease; }
  .sec-block.in{ opacity:1; transform:none; }

  .cta-bar{ position:fixed; left:0; right:0; bottom:0; z-index:60; padding:14px clamp(16px,5vw,40px);
    background:linear-gradient(to top, rgba(8,10,7,0.96), rgba(8,10,7,0.6)); backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,0.08); }
</style>

  <p id="heroSub" class="gh-lead" style="margin-top:18px; max-width:46ch;">Every trip you've planned with Tures — lodging, flights, reservations, excursions, and the local tips worth keeping. Open one to see the whole dossier.</p>
 </div>

<script>
/* ===== example trips (mock) — the drill-down hub ===== */
var TRIPS = [
  {
    id:'nordic', name:'Paris · Lapland · Copenhagen', dates:'Dec 3 – 13, 2026', who:'2 travelers',
    status:'upcoming', statusPill:['pill-confirm','Upcoming · verified ×2'], hero:'assets/img/aurora-1920.webp',
    route:'SEA → CDG → IVL → CPH',
    blurb:'Eleven days, three cities, booked leg by leg. The Hiccup Handler is watching every leg.',
    lodging:[
      {name:'Real Christine, Paris', meta:'Junior Suite · Dec 4–7 · 3 nts', img:'assets/img/stay-paris-320.webp', note:'Garden view, breakfast, Virtuoso amenities at check-in.', conf:'8849-RCP', alts:['Hôtel des Grands Boulevards — $40/nt less','Le Pavillon de la Reine — quieter courtyard']},
      {name:'Javri Lodge, Saariselkä', meta:'Aurora Suite · Dec 7–10 · 3 nts', img:'assets/img/lapland-cabin-320.webp', note:'Private terrace, half-board, airport transfer included.', conf:'JL-12041', alts:['Kakslauttanen Arctic Resort — glass igloo','Northern Lights Village — closer to town']},
      {name:'Hotel Sanders, Copenhagen', meta:'Junior Suite · Dec 10–13 · 3 nts', img:'assets/img/stay-cph-320.webp', note:'Booked direct, rate-protected −$351. Four minutes from Nyhavn.', conf:'SAN-3398', alts:['Nimb Hotel — Tivoli-side','Coco Hotel — design-forward, lower tier']}
    ],
    flights:[
      {title:'AA 142 · SEA → CDG', meta:'Dec 3 · Business · non-stop · seat 5A', conf:'LXJ7Q3', alts:['DL 134 via JFK — earns SkyMiles instead']},
      {title:'AY 1574 · CDG → HEL → IVL', meta:'Dec 7 · Business · approved alt (no non-stop)', conf:'—', alts:['AF1697 + AY633 — longer, Flying Blue miles']},
      {title:'AY 945 · IVL → HEL → CPH', meta:'Dec 10 · Business · refundable', conf:'5RT2QK', alts:[]},
      {title:'KL/DL · CPH → AMS → SEA', meta:'Dec 13 · Business · rerouted around the CDG strike', conf:'7QZ2RB', alts:[]}
    ],
    transport:[ {title:'Ivalo airport transfer', meta:'Dec 7 · met at arrivals → Javri Lodge'} ],
    reservations:[
      {name:'Le Bistrot Paul Bert', meta:'Paris · Dec 5, 8:00 pm · quiet corner', conf:'R-8212'},
      {name:'Septime', meta:'Paris · Dec 6, 9:15 pm', conf:'R-4490'},
      {name:'Geranium', meta:'Copenhagen · Dec 11, 7:30 pm', conf:'R-7731'}
    ],
    excursions:[
      {name:'Aurora snowmobile safari', meta:'Saariselkä · Dec 8, evening · KP forecast 5'},
      {name:'Louvre after-hours, small group', meta:'Paris · Dec 5, 6:30 pm'}
    ],
    tips:[
      'Real Christine holds a quieter garden-side table on request — already noted.',
      'Aurora odds peak Dec 8; Tures will text if the KP index spikes earlier.',
      'Copenhagen runs cold and dark by 3 pm in December — pack accordingly.'
    ]
  },
  {
    id:'tokyo', name:'Tokyo', dates:'Apr 12 – 16, 2026', who:'2 travelers',
    status:'completed', statusPill:['pill-confirm','Completed'], hero:'assets/img/tokyo-1920.webp',
    route:'SEA → HND',
    blurb:'Forty-eight hours, every reservation handled. Nothing missed.',
    lodging:[
      {name:'Trunk Hotel, Shibuya', meta:'Suite · Apr 12–16 · 4 nts', img:'', note:'Design-forward, walkable to everything.', conf:'TRK-2208', alts:['Aman Tokyo — grander register','Hoshinoya Tokyo — ryokan in the city']}
    ],
    flights:[
      {title:'NH 175 · SEA → HND', meta:'Apr 12 · Business · non-stop', conf:'NH8841', alts:[]},
      {title:'NH 176 · HND → SEA', meta:'Apr 16 · Business · non-stop', conf:'NH8842', alts:[]}
    ],
    transport:[ {title:'HND limousine bus + private car', meta:'Apr 12 · to Shibuya'} ],
    reservations:[
      {name:'Sukiyabashi Jiro Roppongi', meta:'Apr 13, 6:00 pm', conf:'R-1188'},
      {name:'Den', meta:'Apr 14, 7:00 pm', conf:'R-2231'},
      {name:'Bar High Five', meta:'Apr 14, 10:00 pm', conf:'walk-in held'}
    ],
    excursions:[ {name:'TeamLab Planets, early entry', meta:'Apr 13, 9:00 am'}, {name:'Tsukiji outer market, guided', meta:'Apr 15, 7:30 am'} ],
    tips:['Den books out 60 days ahead — Tures held it the day it opened.','Carry cash; the best yakitori counters are cash-only.']
  },
  {
    id:'bigisland', name:'Hawaii · Big Island', dates:'Window: October 2026', who:'2 travelers',
    status:'planning', statusPill:['pill-pending','Planning'], hero:'assets/img/tulum-1920.webp',
    route:'SEA → KOA',
    blurb:'A week of warm, slow mornings. Still gathering the details — pick up where you left off.',
    lodging:[
      {name:'Four Seasons Hualalai', meta:'Ocean-view · 7 nts · holding', img:'', note:'On hold pending your dates. Adults-only pool, snorkel lagoon.', conf:'pending', alts:['Mauna Lani, Auberge — lower tier','Kona Village, a Rosewood Resort — newly reopened']}
    ],
    flights:[ {title:'SEA → KOA', meta:'October · Business · ~6h non-stop · watching fares', conf:'—', alts:['Alaska vs Hawaiian — Tures will pick the best fare/seat']} ],
    transport:[ {title:'KOA convertible rental', meta:'on hold'} ],
    reservations:[ {name:'(none yet)', meta:'Tures suggests booking Merriman\'s once dates lock', conf:'—'} ],
    excursions:[ {name:'Mauna Kea summit stargazing', meta:'suggested · books 2 weeks out'}, {name:'Manta ray night snorkel', meta:'suggested'} ],
    tips:['Tell Tures your exact dates and it will lock the Hualalai rate before October fills.','October is shoulder season — quieter beaches, better rates.']
  }
];

var SECTIONS = [
  {key:'lodging',      label:'Lodging',          icon:'⌂'},
  {key:'flights',      label:'Flights & transport', icon:'✈'},
  {key:'reservations', label:'Reservations',     icon:'✦'},
  {key:'excursions',   label:'Excursions',       icon:'◎'},
  {key:'tips',         label:'Tips',             icon:'❝'}
];

var gridEl = document.getElementById('tripsGrid');
var listView = document.getElementById('tripsView');
var detailView = document.getElementById('detailView');
var heroTitle = document.getElementById('heroTitle');
var heroSub = document.getElementById('heroSub');
var esc = function(s){ return String(s).replace(/</g,'&lt;'); };

/* ---------- list: trips as boarding passes ---------- */
function tripCard(t){
  return '<a class="trip-card" data-trip="'+t.id+'" href="#'+t.id+'">'+
    '<div class="tc-art"><div class="img" style="background-image:url(\''+t.hero+'\')"></div><div class="veil"></div>'+
      '<span class="tc-stamp pill '+t.statusPill[0]+'">'+t.statusPill[1]+'</span>'+
      (t.route?'<span class="tc-route">✈ '+esc(t.route)+'</span>':'')+
    '</div>'+
    '<div class="tc-stub">'+
      '<div class="tc-dest">'+esc(t.name)+'</div>'+
      '<div class="tc-meta">'+esc(t.dates)+' · '+esc(t.who)+'</div>'+
      '<div class="tc-open">Open trip →</div>'+
    '</div></a>';
}
function renderList(){
  document.getElementById('tripCount').textContent = TRIPS.length;
  gridEl.innerHTML = TRIPS.map(tripCard).join('');
  [].forEach.call(gridEl.querySelectorAll('.trip-card'), function(c,i){ setTimeout(function(){ c.classList.add('in'); }, 60*i); });
}

/* ---------- detail ---------- */
function rowItem(it, withAlts){
  var alts = (withAlts && it.alts && it.alts.length)
    ? '<button class="text-[12px] alts-toggle mt-1" style="color:var(--gold);background:none;border:none;cursor:pointer;padding:0;">See '+it.alts.length+' alternative'+(it.alts.length>1?'s':'')+' ›</button>'+
      '<div class="alts">'+it.alts.map(function(a){ return '<div class="alt-row"><span style="color:var(--gold)">◦</span>'+esc(a)+'<span class="alt-swap">Swap in</span></div>'; }).join('')+'</div>'
    : '';
  var conf = it.conf ? '<span class="mt-conf">'+esc(it.conf)+'</span>' : '';
  return '<div class="mt-item">'+
    '<div class="flex items-center justify-between gap-3">'+
      '<div class="min-w-0"><div class="mt-name">'+esc(it.name||it.title)+'</div>'+
        '<div class="mt-meta">'+esc(it.meta)+'</div></div>'+ conf +
    '</div>'+
    (it.note ? '<p class="mt-note">'+esc(it.note)+'</p>' : '')+
    alts +
  '</div>';
}
function lodgeItem(it){
  var thumb = it.img ? '<div class="item-thumb" style="background-image:url(\''+it.img+'\')"></div>'
                     : '<div class="item-thumb">'+esc((it.name||'?').charAt(0))+'</div>';
  var alts = (it.alts && it.alts.length)
    ? '<button class="text-[12px] alts-toggle mt-2" style="color:var(--gold);background:none;border:none;cursor:pointer;padding:0;">See '+it.alts.length+' alternative'+(it.alts.length>1?'s':'')+' ›</button>'+
      '<div class="alts">'+it.alts.map(function(a){ return '<div class="alt-row"><span style="color:var(--gold)">◦</span>'+esc(a)+'<span class="alt-swap">Swap stay</span></div>'; }).join('')+'</div>'
    : '';
  return '<div class="mt-item">'+
    '<div class="flex gap-3.5">'+thumb+
      '<div class="min-w-0 flex-1"><div class="flex items-start justify-between gap-2">'+
        '<div class="mt-name">'+esc(it.name)+'</div>'+
        (it.conf?'<span class="mt-conf">'+esc(it.conf)+'</span>':'')+'</div>'+
        '<div class="mt-meta">'+esc(it.meta)+'</div>'+
        (it.note?'<p class="mt-note">'+esc(it.note)+'</p>':'')+ alts +
      '</div>'+
    '</div></div>';
}
function sectionBlock(t, sec){
  var items = t[sec.key] || [];
  var inner = '';
  if(sec.key==='lodging') inner = '<div class="space-y-3">'+items.map(lodgeItem).join('')+'</div>';
  else if(sec.key==='tips') inner = '<div class="mt-item"><ul class="space-y-3">'+items.map(function(tip){ return '<li class="flex gap-2.5" style="font-size:14px;color:var(--gh-cream);line-height:1.6;"><span style="color:var(--gold);margin-top:2px;">✦</span><span>'+esc(tip)+'</span></li>'; }).join('')+'</ul></div>';
  else inner = '<div class="space-y-3">'+items.map(function(it){ return rowItem(it, sec.key==='flights'); }).join('')+'</div>';
  return '<div class="sec-block" data-sec="'+sec.key+'" style="scroll-margin-top:90px">'+
    '<div class="flex items-center gap-2 mb-4 mt-10"><span style="color:var(--gold);font-size:18px;">'+sec.icon+'</span>'+
      '<h2 class="gh-h3" style="font-size:24px;">'+sec.label+'</h2>'+
      '<span class="gh-eyebrow" style="margin-left:4px;">'+items.length+'</span></div>'+
    inner +
  '</div>';
}
function openTrip(id){
  var t = TRIPS.filter(function(x){return x.id===id;})[0];
  if(!t) return;
  heroTitle.textContent = t.name;
  heroSub.textContent = t.dates + ' · ' + t.who + ' — ' + t.blurb;
  var tabs = SECTIONS.map(function(s){ return '<a href="#sec-'+s.key+'" class="sec-tab" data-jump="'+s.key+'">'+s.label+'</a>'; }).join('');
  detailView.innerHTML =
    '<button class="back gh-btn-ghost gh-btn mb-6" style="padding:9px 18px;">← My Trips</button>'+
    '<div class="dt-hero"><div class="img" style="background-image:url(\''+t.hero+'\')"></div><div class="veil"></div>'+
      '<div class="cap"><div class="flex items-center justify-between flex-wrap gap-3">'+
        '<div><div class="gh-display" style="font-size:clamp(28px,3.4vw,44px);color:#fff;line-height:1.05;">'+esc(t.name)+'</div>'+
        '<div class="gh-lead" style="font-size:13px;color:var(--gh-cream);margin-top:6px;">'+esc(t.dates)+' · '+esc(t.who)+'</div></div>'+
        '<span class="pill '+t.statusPill[0]+'">'+t.statusPill[1]+'</span></div></div></div>'+
    '<div class="flex gap-2 overflow-x-auto pb-1 pt-4 sticky top-0 z-10 -mx-1 px-1" style="background:linear-gradient(180deg,var(--gh-bg) 70%,transparent)">'+tabs+'</div>'+
    SECTIONS.map(function(s){ return '<span id="sec-'+s.key+'"></span>'+sectionBlock(t, s); }).join('');
  listView.style.display='none';
  detailView.style.display='';
  window.scrollTo({top:0, behavior:'auto'});
  [].forEach.call(detailView.querySelectorAll('.sec-block'), function(b,i){ setTimeout(function(){ b.classList.add('in'); }, 70*i); });
}
function backToList(){
  detailView.style.display='none';
  listView.style.display='';
  heroTitle.innerHTML = 'Your passport,<br><span class="gh-accent gh-italic">kept for you.</span>';
  heroSub.textContent = "Every trip you've planned with Tures — lodging, flights, reservations, excursions, and the local tips worth keeping. Open one to see the whole dossier.";
  if(location.hash) history.replaceState(null,'',location.pathname);
  window.scrollTo({top:0, behavior:'auto'});
}

/* ---------- events (delegation) ---------- */
document.addEventListener('click', function(e){
  var card = e.target.closest('.trip-card');
  if(card){ e.preventDefault(); openTrip(card.getAttribute('data-trip')); return; }
  if(e.target.closest('.back')){ backToList(); return; }
  var alt = e.target.closest('.alts-toggle');
  if(alt){ e.preventDefault(); var box = alt.parentElement.querySelector('.alts'); if(box) box.classList.toggle('open'); alt.textContent = box.classList.contains('open') ? 'Hide alternatives ›' : alt.textContent.replace('Hide alternatives','See alternatives'); return; }
  var jump = e.target.closest('[data-jump]');
  if(jump){ e.preventDefault(); var tgt = document.getElementById('sec-'+jump.getAttribute('data-jump')); if(tgt) tgt.scrollIntoView({behavior:'smooth'}); document.querySelectorAll('.sec-tab').forEach(function(x){x.classList.toggle('on', x===jump);}); }
});

renderList();
/* deep link: #tripId opens that trip */
