<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tures — Phone demo (recording asset)</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --acc:#4ADE80; --acc-2:#86EFAC; --cream:#F0EAD8; --dim:#B8AD96; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }
  body{ font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:radial-gradient(130% 100% at 50% 0%, #16241a 0%, #0A0D08 60%); color:var(--cream); padding:40px 20px; overflow:hidden; }
  body::before{ content:""; position:fixed; inset:0; z-index:0; opacity:.5; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 20 L20 0 L40 20 L20 40 Z' fill='none' stroke='%23ffffff' stroke-opacity='0.04' stroke-width='0.6'/%3E%3C/svg%3E");
    mask-image:radial-gradient(70% 70% at 50% 45%, #000 30%, transparent); }

  /* ── the phone ── */
  .stage{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:22px; }
  .phone{ width:356px; max-width:92vw; background:linear-gradient(165deg,#1b241b,#0b110c); border-radius:52px; padding:13px;
    box-shadow:0 60px 120px -40px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.06), inset 0 1px 0 rgba(255,255,255,0.12); }
  .screen{ background:#0a0f0b; border-radius:40px; overflow:hidden; position:relative; height:720px; max-height:74vh; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:128px; height:30px; background:#000; border-radius:0 0 18px 18px; z-index:6; }
  .statusbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px 4px; font-size:13px; font-weight:600; color:var(--cream); position:relative; z-index:2; }
  .statusbar .icons{ display:flex; align-items:center; gap:6px; font-size:11px; opacity:.9; }

  .appbar{ display:flex; align-items:center; gap:11px; padding:8px 16px 11px; border-bottom:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.02); }
  .avatar{ width:42px; height:42px; border-radius:50%; overflow:hidden; border:2px solid var(--acc); flex-shrink:0; box-shadow:0 0 14px -3px var(--acc); }
  .avatar svg{ display:block; width:100%; height:100%; }
  .who .nm{ font-family:'Playfair Display',serif; font-size:17px; color:#fff; line-height:1; display:flex; align-items:center; gap:7px; }
  .who .nm .live{ width:7px; height:7px; border-radius:50%; background:var(--acc); box-shadow:0 0 7px var(--acc); }
  .who .sub{ font-size:11px; color:var(--acc); letter-spacing:.03em; margin-top:3px; }
  .appbar .call{ margin-left:auto; display:flex; gap:16px; color:var(--acc); font-size:17px; opacity:.85; }

  .thread{ flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  .thread::-webkit-scrollbar{ width:0; }
  .stamp{ align-self:center; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); opacity:.7; margin:6px 0; }
  .bub{ max-width:82%; padding:11px 14px; font-size:14.5px; line-height:1.5; border-radius:18px;
    opacity:0; transform:translateY(10px) scale(.96); transition:opacity .3s ease, transform .35s cubic-bezier(.2,1.4,.4,1); }
  .bub.in{ opacity:1; transform:none; }
  .bub.c{ align-self:flex-start; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.09); color:#e6efe2; border-top-left-radius:5px; }
  .bub.u{ align-self:flex-end; background:var(--acc); color:#06120a; border-top-right-radius:5px; font-weight:500; }
  .bub .code{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--acc); }
  .chip{ align-self:flex-start; display:inline-flex; align-items:center; gap:9px; padding:8px 14px; border-radius:99px;
    background:rgba(74,222,128,0.1); border:1px solid var(--acc); color:var(--acc); font-size:12.5px; letter-spacing:.02em;
    opacity:0; transform:translateY(8px); transition:opacity .3s ease, transform .35s ease; }
  .chip.in{ opacity:1; transform:none; }
  .chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--acc); box-shadow:0 0 7px var(--acc); }
  .chip .code{ font-family:'JetBrains Mono',monospace; }
  .typing{ align-self:flex-start; display:none; gap:5px; align-items:center; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.09);
    padding:13px 16px; border-radius:18px; border-top-left-radius:5px; }
  .typing.on{ display:inline-flex; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--acc); animation:tb 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes tb{ 0%,80%,100%{ transform:translateY(0); opacity:.4; } 40%{ transform:translateY(-4px); opacity:1; } }

  .inputbar{ display:flex; align-items:center; gap:9px; padding:11px 14px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,0.06); }
  .inputbar .field{ flex:1; background:rgba(255,255,255,0.05); border-radius:99px; padding:10px 16px; font-size:13px; color:var(--dim); }
  .inputbar .send{ width:34px; height:34px; border-radius:50%; background:var(--acc); color:#06120a; display:grid; place-items:center; font-weight:700; flex-shrink:0; }

  .ctl{ position:relative; z-index:1; display:flex; align-items:center; gap:14px; }
  .ctl button{ background:rgba(8,12,8,0.6); border:1px solid var(--acc); color:var(--cream); font-family:'DM Sans',sans-serif;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase; padding:11px 22px; border-radius:99px; cursor:pointer; backdrop-filter:blur(10px); transition:background .2s; }
  .ctl button:hover{ background:rgba(14,20,14,0.8); }
  .wm{ font-family:'Playfair Display',serif; font-size:18px; color:var(--cream); opacity:.85; }
  .wm b{ color:var(--acc); font-weight:400; }
</style>
</head>
<body>

  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <div class="statusbar"><span>9:41</span><span class="icons">●●● &nbsp;❋ &nbsp;▮▮▮</span></div>
        <div class="appbar">
          <div class="avatar"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#5C2E18"/><ellipse cx="24" cy="14" rx="12" ry="8" fill="#1A0A04"/><rect x="12" y="14" width="24" height="10" fill="#1A0A04"/><ellipse cx="24" cy="24" rx="10" ry="11" fill="#C4784A"/><ellipse cx="20.5" cy="22" rx="1.6" ry="1.8" fill="#1A0800"/><ellipse cx="27.5" cy="22" rx="1.6" ry="1.8" fill="#1A0800"/><circle cx="21" cy="21.4" r="0.5" fill="#fff" opacity=".7"/><circle cx="28" cy="21.4" r="0.5" fill="#fff" opacity=".7"/><path d="M20.5 28.5 Q24 30.5 27.5 28.5" stroke="#8B3A1A" stroke-width="1.2" stroke-linecap="round" fill="none"/><ellipse cx="24" cy="44" rx="14" ry="6" fill="#1E3A2A"/></svg></div>
          <div class="who"><div class="nm">Tures <span class="live"></span></div><div class="sub">Your concierge · Live</div></div>
          <div class="call">⌕ ☰</div>
        </div>
        <div class="thread" id="thread">
          <div class="typing" id="typing"><span></span><span></span><span></span></div>
        </div>
        <div class="inputbar"><div class="field">Message Tures…</div><div class="send">↑</div></div>
      </div>
    </div>
    <div class="ctl">
      <span class="wm">t<b>✦</b>ures</span>
      <button id="replay">▶ Replay</button>
    </div>
  </div>

<script>
(function(){
  var thread = document.getElementById('thread');
  var typing = document.getElementById('typing');

  // Each step: {u|c|stamp|chip, text, code?, pre?(typing ms before a concierge msg), gap?(pause after)}
  var SCRIPT = [
    { u:'Paris in May — 4 nights, somewhere quiet near the Marais. Business class from SFO.', gap:700 },
    { c:'On it. Reading that as SFO → CDG, business, 4 nights in the Marais.', pre:1300, gap:600 },
    { c:'Booked Le Pavillon de la Reine — courtyard junior suite, your quiet register. AF 84 in business, seat 2A.', pre:1700, gap:500 },
    { chip:'Confirmed', code:'TUR-8841', gap:700 },
    { c:'Two dinners held to your taste — Septime and Clamato. I’ll watch the flight and handle anything that moves.', pre:1500, gap:800 },
    { u:'Perfect. Thank you.', gap:1400 },
    { stamp:'— Three days later —', gap:900 },
    { c:'Heads up — a French ATC strike threatened your return Thursday. I’ve already rebooked you around it, same evening, business. Nothing for you to do.', pre:1800, gap:550 },
    { chip:'Rebooked', code:'TUR-9020 · $0 change fee', gap:800 },
    { u:'You’re a lifesaver.', gap:900 },
    { c:'That’s the idea. Enjoy Paris — I’ve got the rest.', pre:1400, gap:2600 }
  ];

  function clear(){ Array.prototype.slice.call(thread.querySelectorAll('.bub,.chip,.stamp')).forEach(function(n){ n.remove(); }); typing.classList.remove('on'); }
  function scrollDown(){ thread.scrollTop = thread.scrollHeight; }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function addBubble(text, who){
    var b = document.createElement('div'); b.className = 'bub ' + who; b.innerHTML = text;
    thread.insertBefore(b, typing); scrollDown();
    requestAnimationFrame(function(){ b.classList.add('in'); });
  }
  function addChip(label, code){
    var c = document.createElement('div'); c.className = 'chip';
    c.innerHTML = '<span class="dot"></span>' + label + ' · <span class="code">' + code + '</span>';
    thread.insertBefore(c, typing); scrollDown();
    requestAnimationFrame(function(){ c.classList.add('in'); });
  }
  function addStamp(text){ var s = document.createElement('div'); s.className='stamp'; s.textContent=text; thread.insertBefore(s, typing); scrollDown(); }

  var running = false;
  async function play(){
    if(running) return; running = true;
    clear();
    await wait(700);
    for(var i=0;i<SCRIPT.length;i++){
      var s = SCRIPT[i];
      if(s.u){ addBubble(s.u, 'u'); }
      else if(s.stamp){ addStamp(s.stamp); }
      else if(s.chip){ addChip(s.chip, s.code); }
      else if(s.c){
        typing.classList.add('on'); scrollDown();
        await wait(s.pre || 1200);
        typing.classList.remove('on');
        addBubble(s.c, 'c');
      }
      await wait(s.gap || 600);
    }
    running = false;
    if(window.__loop) setTimeout(play, 100);
  }

  window.__loop = true;               // loop for easy screen-recording
  document.getElementById('replay').addEventListener('click', function(){ if(!running) play(); });
  play();
})();
</script>
</body>
</html>
