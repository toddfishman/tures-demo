<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>t✦ures — One trip, start to finish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surface:#f6f6f6;--surface-2:#efefef;--line:rgba(26,26,26,.10);--line-2:rgba(26,26,26,.16);--text:#1a1a1a;--muted:#6f6f6f;--faint:#9a9a9a;--acc:#ff4929;--acc-2:#ff775f;--acc-deep:#cf3b1f;--acc-dim:rgba(255,73,41,.10);--acc-line:rgba(255,73,41,.28);--good:#2e9e5b;--warn:#c77a00;--rain:#3b6fb0;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
a{color:inherit;text-decoration:none}.serif{font-family:'Playfair Display',Georgia,serif}.mono{font-family:'Space Mono',monospace}.spark{color:var(--acc)}em{font-style:italic;color:var(--acc-2)}
.nv{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:linear-gradient(to bottom,rgba(255,255,255,.92),rgba(255,255,255,.7));border-bottom:1px solid var(--line)}
.nv .in{max-width:1180px;margin:0 auto;padding:0 22px;height:64px;display:flex;align-items:center;gap:16px}
.nv .lg{display:inline-flex;align-items:center;gap:7px;font-family:'Playfair Display',serif;font-size:23px;font-weight:600;flex:0 0 auto}.nv .lg .cv{font-size:11px;color:var(--muted)}
.nv .pl{flex:1;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line-2);border-radius:999px;padding:5px 6px 5px 16px}
.nv .pl input{flex:1;border:none;outline:none;background:none;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--text);min-width:0}.nv .pl input::placeholder{color:var(--faint)}
.nv .pl button{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;background:var(--acc);cursor:pointer;display:grid;place-items:center}
.nv .ac{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg);color:var(--muted);display:grid;place-items:center;cursor:pointer}
@media(max-width:620px){.nv .pl{max-width:none}.nv .lg{font-size:20px}}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;cursor:pointer;border:none;border-radius:999px;padding:12px 22px;background:var(--acc);color:#fff}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc-deep);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-2);border-radius:5px;padding:3px 7px}
h1{font-family:'Playfair Display',serif;font-weight:500;line-height:1.04;letter-spacing:-.01em;font-size:clamp(34px,5vw,56px)}
.lead{font-size:clamp(16px,1.5vw,19px);color:var(--muted);font-weight:300}
/* concept 3 */
.hw{max-width:1120px;margin:0 auto;padding:48px 24px;text-align:center}
.line{position:relative;margin:48px auto 0;max-width:1000px}
.track{position:absolute;left:6%;right:6%;top:13px;height:3px;background:var(--line-2);border-radius:3px}
.fill{position:absolute;left:6%;top:13px;height:3px;background:var(--acc);border-radius:3px;width:0;transition:width .6s cubic-bezier(.4,.1,.2,1)}
.stops{position:relative;display:flex;justify-content:space-between;gap:8px}
.stop{flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0}
.stop .dot{width:30px;height:30px;border-radius:50%;background:var(--bg);border:3px solid var(--line-2);display:grid;place-items:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--faint);transition:all .35s;position:relative;z-index:1}
.stop.on .dot,.stop.done .dot{border-color:var(--acc);color:var(--acc-deep)}
.stop.on .dot{box-shadow:0 0 0 5px var(--acc-dim);transform:scale(1.12)}
.stop .day{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:10px}
.stop.on .day{color:var(--acc-deep)}
.stop .ttl{font-family:'Playfair Display',serif;font-size:15px;margin-top:3px;color:var(--text)}
.phaserow{display:flex;max-width:1000px;margin:14px auto 0}
.phaserow span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);text-align:center}
.panel{max-width:560px;margin:36px auto 0;border:1px solid var(--acc-line);border-radius:16px;background:var(--bg);box-shadow:0 30px 70px -45px rgba(0,0,0,.4);overflow:hidden;text-align:left;min-height:150px}
.panel .ph{padding:13px 18px;border-bottom:1px solid var(--line);background:var(--acc-dim);display:flex;align-items:center;gap:9px}
.panel .ph .day{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-deep);font-weight:600}
.panel .ph .tag{margin-left:auto}
.panel .pb{padding:16px 18px}
.panel .pb .pt{font-family:'Playfair Display',serif;font-size:19px;margin-bottom:6px}
.panel .pb .pd{font-size:14px;color:var(--muted);line-height:1.55}
.panel .pb .code{font-family:'Space Mono',monospace;font-size:12.5px;color:var(--acc-deep);margin-top:8px}
.homegrid{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.homegrid .hg .n{font-family:'Space Mono',monospace;font-size:17px;color:var(--acc-deep)}.homegrid .hg .l{font-size:11px;color:var(--muted)}
.cta{margin-top:34px}
@media(max-width:680px){
  .track,.fill{left:14px;right:auto;top:0;bottom:0;width:3px!important;height:auto}
  .fill{height:0;transition:height .6s}
  .stops{flex-direction:column;align-items:flex-start;gap:18px;padding-left:0}
  .stop{flex-direction:row;align-items:center;gap:14px;width:100%}
  .stop .day{margin-top:0}.phaserow{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="nv"><div class="in">
  <span class="lg">t<span class="spark">✦</span>ures <span class="cv">▾</span></span>
  <form class="pl" onsubmit="return false"><input placeholder="Where to? Describe your trip and Tures plans it…" aria-label="Plan a trip"><button aria-label="Plan it"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
  <button class="ac" aria-label="Account"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg></button>
</div></header>

<section class="hw">
  <span class="eyebrow"><span class="dot"></span> The whole arc</span>
  <h1 style="margin:22px auto 0">One trip, <em>start to finish.</em></h1>
  <p class="lead" style="max-width:56ch;margin:16px auto 0">From the first message to the receipts when you land — Tures is there the whole way. Watch a trip move through it.</p>

  <div class="line">
    <div class="track"></div><div class="fill" id="fill"></div>
    <div class="stops" id="stops">
      <div class="stop" data-i="0"><span class="dot">1</span><span class="day">Mon</span><span class="ttl">Booked</span></div>
      <div class="stop" data-i="1"><span class="dot">2</span><span class="day">Wed</span><span class="ttl">Heads-up</span></div>
      <div class="stop" data-i="2"><span class="dot">3</span><span class="day">Thu</span><span class="ttl">Caught it</span></div>
      <div class="stop" data-i="3"><span class="dot">4</span><span class="day">Sat</span><span class="ttl">Good news</span></div>
      <div class="stop" data-i="4"><span class="dot">5</span><span class="day">Sun</span><span class="ttl">Home</span></div>
    </div>
  </div>
  <div class="phaserow"><span style="flex:1">— before —</span><span style="flex:2.1">— during —</span><span style="flex:1">— after —</span></div>

  <div class="panel" id="panel"></div>

  <div class="cta"><a class="btn" href="../plan.html">Plan a trip
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
</section>

<script>
(function(){
  var STOPS=[
    {day:'Monday · before',t:'Booked from one message',d:'“5 days on Maui in June, oceanfront, business if reasonable.” Held in minutes — flights, hotel, the table.',code:'Hawaiian · HA · QK7T2P · Montage Kapalua Bay',sample:true},
    {day:'Wednesday · during',t:'A storm forming Thursday',d:'Tures saw it first and moved your Molokini snorkeling to today — clear water, same operator. You did nothing.',sample:false},
    {day:'Thursday · during',t:'Caught the delay',d:'Your flight home shifted two hours. Rebooked on the 4:55, same cabin, no change fee — before the airline even emailed.',code:'Rebooked · seats 2A, 2C',sample:true},
    {day:'Saturday · during',t:'Good news, too',d:'A better oceanfront table opened at Mama’s Fish House for your anniversary night. Tures took it and let you know.',sample:false},
    {day:'Sunday · after',t:'Welcome home — handled',d:'The receipts, the day you land:',home:true,sample:true}
  ];
  var panel=document.getElementById('panel'), fill=document.getElementById('fill');
  var stops=[].slice.call(document.querySelectorAll('.stop'));
  var vert=window.matchMedia('(max-width:680px)').matches;
  function render(i){
    var s=STOPS[i];
    var body=s.home
      ? '<div class="pd">The receipts, the day you land:</div><div class="homegrid">'+
        '<div class="hg"><div class="n">$612</div><div class="l">saved</div></div>'+
        '<div class="hg"><div class="n">42,000</div><div class="l">miles credited</div></div>'+
        '<div class="hg"><div class="n">14 hrs</div><div class="l">back</div></div>'+
        '<div class="hg"><div class="n">1</div><div class="l">disaster dodged</div></div></div>'+
        '<div class="pd" style="margin-top:10px">Expense report ready · and your Taste Engine noted the oceanfront table at Mama’s Fish House.</div>'
      : '<div class="pd">'+s.d+'</div>'+(s.code?'<div class="code">'+s.code+'</div>':'');
    panel.innerHTML='<div class="ph"><span class="day">'+s.day+'</span>'+(s.sample?'<span class="tag">Sample</span>':'')+'</div>'+
      '<div class="pb"><div class="pt serif">'+s.t+'</div>'+body+'</div>';
    stops.forEach(function(el,k){ el.classList.toggle('on',k===i); el.classList.toggle('done',k<i); });
    var pct = STOPS.length>1 ? (i/(STOPS.length-1))*100 : 0;
    if(vert){ fill.style.height=pct+'%'; } else { fill.style.width='calc('+(88*pct/100)+'%)'; }
  }
  var i=0; render(0);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer=null;
  function play(){ if(reduce) return; timer=setInterval(function(){ i=(i+1)%STOPS.length; render(i); }, 2600); }
  function jump(k){ i=k; render(i); if(timer){clearInterval(timer);} play(); }
  stops.forEach(function(el){ el.addEventListener('click',function(){ jump(+el.dataset.i); }); });
  play();
})();
</script>
</body></html>
